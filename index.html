<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holo Productions — Coming Soon</title>
<meta name="description" content="Holo Productions is coming soon.">
<link rel="icon" type="image/webp" href="logo-options/hp-logo-3-1-logo.webp">
<style>
  /* HP-THEME-2026-11-23: Holo Productions' own style — soft rounded look, gradient glow, system font.
     NOT the Arcade pixel/HUD look. Duck logo + lofi studio banner. */
  :root{
    --bg:#0d0a1f; --card:#171231; --card2:#1e1845;
    --text:#f4f1ff; --muted:#c9c2e8;
    --pink:#ff6ec7; --purple:#a06bff; --blue:#4ec9ff; --cyan:#39e6d4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1000px 600px at 50% -10%, #2a1f5c 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 48px;
  }
  .wrap{width:100%;max-width:720px;text-align:center}
  @media(min-width:1024px){ .wrap{max-width:920px} }
  .banner{
    width:100%; height:clamp(110px,28vw,170px); object-fit:cover;
    border-radius:16px; display:block;
    box-shadow:0 8px 32px rgba(160,107,255,.30), 0 0 24px rgba(255,110,199,.12);
  }
  .logo{
    width:96px; height:96px; object-fit:cover; display:block; margin:-48px auto 0;
    border-radius:28px; border:3px solid var(--bg);
    box-shadow:0 0 22px rgba(255,210,63,.35), 0 6px 18px rgba(0,0,0,.45);
    animation:hp-float 4.5s ease-in-out infinite;
  }
  h1{
    font-size:clamp(34px,8vw,56px); font-weight:800; letter-spacing:.5px; margin:14px 0 6px;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(160,107,255,.45)) drop-shadow(0 2px 18px rgba(255,110,199,.25));
    animation:hp-float 4.5s ease-in-out infinite;
  }
  @keyframes hp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .tag{color:var(--muted);font-size:clamp(15px,4vw,18px);line-height:1.55;max-width:540px;margin:0 auto}
  .soon{
    display:inline-block;margin:22px 0 6px;padding:8px 18px;border-radius:999px;
    border:1px solid var(--purple); color:var(--cyan);
    font-weight:700; letter-spacing:2px; font-size:13px; text-transform:uppercase;
    box-shadow:0 0 16px rgba(57,230,212,.18), inset 0 0 12px rgba(160,107,255,.12);
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .soon:hover{box-shadow:0 0 24px rgba(57,230,212,.35), inset 0 0 16px rgba(160,107,255,.2);transform:translateY(-1px)}
  footer{margin-top:34px;color:var(--muted);font-size:13px;line-height:1.6}
  @media (prefers-reduced-motion: reduce){
    .logo,h1{animation:none}
    .soon{transition:none}
    .soon:hover{transform:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="banner" src="banner-frames/hp-banner-lofi-studio-pick.webp" alt="Holo Productions — lofi studio with a rainy window">
    <img class="logo" src="logo-options/hp-logo-3-1-logo.webp" alt="Holo Productions duck logo">
    <h1>Holo Productions</h1>
    <p class="tag">Every ridiculous idea, one home. Check back soon!</p>
    <span class="soon">Coming Soon</span>

    <footer>
      ✨ Holo Productions · holoproductions.ca<br>
      Every ridiculous idea, one home. Check back soon!
    </footer>
  </main>
</body>
</html>
